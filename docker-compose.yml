services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports: ["8080:80"]
    depends_on: [backend]
  backend:
    build: ./backend
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:8080
      MONGO_URI: mongodb://mongodb:27017/social-media
    ports: ["5000:5000"]
    depends_on: [mongodb]
  mongodb:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
volumes:
  mongo-data:

